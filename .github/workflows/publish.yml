name: Publish

# Merging a version bump of package.json into master releases it:
# the `release` job creates the tag vX.Y.Z and the GitHub release (notes taken
# from docs/guide/changelog.md), then `publish` puts it on npm after approval
# of the `npm` environment. A release made by hand on GitHub also publishes.
# Authentication: npm trusted publishing (OIDC), no token stored. It is tied
# to this file name and the `npm` environment: keep both.

on:
  push:
    branches: [master]
    paths: [package.json]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: Tag and GitHub release
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release."
            exit 0
          fi
          # Notes: the "## vX.Y.Z" section of the changelog, up to the next "---".
          # Site-relative links (/guide/...) point to the docs site.
          awk -v h="## $tag" '$0==h{on=1;next} on&&/^---$/{exit} on' docs/guide/changelog.md \
            | sed 's#](/#](https://tfoucher5.github.io/fuzzy-toolkit/#g' > notes.md
          if [ ! -s notes.md ]; then
            echo "docs/guide/changelog.md has no \"## $tag\" section. Rename Unreleased to $tag in the release PR."
            exit 1
          fi
          # Credit first-time contributors: GitHub's "New Contributors" section, if any.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -q .body \
            | awk '/^## New Contributors/{on=1} /^\*\*Full Changelog/{on=0} on' > contributors.md || true
          if [ -s contributors.md ]; then printf '\n' >> notes.md; cat contributors.md >> notes.md; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: release
    # always(): run after a hand-made release too, where `release` is skipped.
    if: always() && (github.event_name == 'release' || needs.release.outputs.tag != '')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json ($version)"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or later, bundled with Node 24.
      - name: npm supports trusted publishing
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a*1e6+b*1e3+c < 11005001) { console.error('npm ' + process.argv[1] + ' is older than 11.5.1'); process.exit(1) }" "$(npm -v)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run size:check
      - run: npm pack --dry-run
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

  assets:
    name: Attach signed package to the GitHub release
    needs: [release, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # The npm tarball, its SLSA provenance (Sigstore bundle) and the signed in-toto statement.
      - run: node scripts/release-assets.mjs "${TAG#v}" release-assets
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release-assets/* --clobber
