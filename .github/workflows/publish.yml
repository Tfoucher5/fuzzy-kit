name: Publish

# Publishing a GitHub release (tag vX.Y.Z) publishes that version to npm.
# Authentication: npm trusted publishing (no token to leak). Configure it once
# on npmjs.com > fuzzy-toolkit > Settings > Trusted publishing, with this
# repository and the workflow file name `publish.yml`.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json ($version)"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run size:check
      - run: npm pack --dry-run
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
