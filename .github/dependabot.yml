version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # fuzzy-toolkit has no runtime dependencies: these are dev tools. Minor and
    # patch updates come grouped; major ones (TypeScript, React...) are done
    # by hand, since they usually need code or config changes.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # esbuild 0.26+ breaks the VitePress 1 docs build (0.x minors are breaking).
      - dependency-name: esbuild
        versions: ['>=0.26.0']
