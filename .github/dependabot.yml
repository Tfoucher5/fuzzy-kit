version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # fuzzy-toolkit has no runtime dependencies: these are dev tools.
    groups:
      dev-dependencies:
        dependency-type: development
